[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant: a Brain API on the desktop, reached over Tailscale, with a web interface."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "job-finder",
]

[project.scripts]
jarvis-brain = "jarvis.brain.app:main"

[tool.uv.sources]
job-finder = { path = "../job-finder", editable = true }

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["tests"]
